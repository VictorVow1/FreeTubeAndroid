# Builds a signed release APK on every push to the fork branch and publishes it as a GitHub release

name: Build Fork Release APK

on:
  workflow_dispatch:
  push:
    branches: [ fork ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: 10

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: 24.x
        cache: pnpm

    - run: pnpm run ci

    - name: Set version number
      id: version
      run: |
        # the build number after the second "-" becomes part of the Android versionCode (see android/app/build.gradle.kts),
        # so every run produces an APK that installs as an update over the previous one
        version="$(jq --raw-output '.version' package.json)-fork-${GITHUB_RUN_NUMBER}"
        jq --arg version "$version" '.version = $version' package.json > package.json.tmp
        mv package.json.tmp package.json
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: 📦 Pack for 📱Android
      run: pnpm run pack:android

    - name: 🦴 Fetch keystore from secrets
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: echo "$KEYSTORE" | base64 -d > freetube.keystore

    - name: Inject signing config
      run: |
        sed -i 's@// inject signing config@storeFile = file("../../freetube.keystore")\n        storePassword = System.getenv("KEYSTORE_PASSWORD")\n        keyAlias = System.getenv("KEY_ALIAS")\n        keyPassword = System.getenv("KEYSTORE_PASSWORD")@' android/app/build.gradle.kts

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 #v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build release APK with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        cd android/
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Rename APK w/ version info
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/release/app-release.apk "dist/freetube-${VERSION}-Android.apk"

    - name: 📡 Upload APK Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: freetube-${{ steps.version.outputs.version }}-Android.apk
        path: dist/freetube-${{ steps.version.outputs.version }}-Android.apk

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release create "v${VERSION}" "dist/freetube-${VERSION}-Android.apk" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "FreeTube Android ${VERSION}" \
          --notes "Built from ${GITHUB_SHA} on the ${GITHUB_REF_NAME} branch." \
          --latest
